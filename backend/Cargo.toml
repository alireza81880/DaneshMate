[package]
name = "daneshmate-backend"
version = "0.1.0"
edition = "2021"
authors = ["DaneshMate Team"]
description = "Embedded Local Native Library (FFI Bridge) for DaneshMate"

[lib]
name = "daneshmate_core"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Serialization & Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Memory-Safe Fast Concurrency Synchronization
parking_lot = "0.12"

# Time & Utilities
chrono = { version = "0.4", features = ["serde"] }

# Production Release Compilation Optimizations
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
