name: Android Test APK Build (Standalone)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    name: Build Android Test APK (arm64-v8a Standalone)
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set Up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Set Up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 4. Set Up Android NDK & SDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: 5. Set Up Rust Toolchain (arm64-v8a Android Target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android

      - name: 6. Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked

      - name: 7. Install Project Dependencies
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          cd frontend && npm install --no-audit --no-fund --legacy-peer-deps

      - name: 8. Generate Platform Assets from Source
        run: |
          npm install --no-save --legacy-peer-deps sharp || (cd frontend && npm install --no-save --legacy-peer-deps sharp)
          node frontend/scripts/generate_assets.js

      - name: 9. Scaffold Native Android Project via Expo Prebuild
        run: |
          cd frontend
          npx expo prebuild --clean --platform android --no-install

      - name: 10. Configure Android Build Settings (Hermes & arm64-v8a)
        run: |
          cd frontend/android

          # 1. Verify Expo Config Plugin copied native sources and registered package
          echo "[+] Verifying Native Module integration generated by Expo Config Plugin..."
          [ -f "app/src/main/java/com/daneshmate/app/DaneshMateModule.java" ] && echo "[✓] DaneshMateModule.java present"
          [ -f "app/src/main/java/com/daneshmate/app/DaneshMatePackage.java" ] && echo "[✓] DaneshMatePackage.java present"
          if grep -q "DaneshMatePackage" app/src/main/java/com/daneshmate/app/MainApplication.*; then
            echo "[✓] DaneshMatePackage registered in MainApplication"
          fi

          # 2. Configure gradle.properties to enforce arm64-v8a and enable Hermes
          if [ -f "gradle.properties" ]; then
            sed -i 's/hermesEnabled=false/hermesEnabled=true/g' gradle.properties || true
            if ! grep -q "hermesEnabled" gradle.properties; then
              echo "hermesEnabled=true" >> gradle.properties
            fi
            if grep -q "reactNativeArchitectures" gradle.properties; then
              sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/g' gradle.properties || true
            else
              echo "reactNativeArchitectures=arm64-v8a" >> gradle.properties
            fi
            echo "[✓] Configured gradle.properties (reactNativeArchitectures=arm64-v8a, hermesEnabled=true)"
          fi

      - name: 11. Cross-Compile & Strip Rust Native Library (libdaneshmate_core.so)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x backend/scripts/build_rust_mobile.sh
          ./backend/scripts/build_rust_mobile.sh
          test -f frontend/android/app/src/main/jniLibs/arm64-v8a/libdaneshmate_core.so || exit 1

          # Remove non-64-bit architectures
          rm -rf frontend/android/app/src/main/jniLibs/armeabi-v7a
          rm -rf frontend/android/app/src/main/jniLibs/x86

          # Strip debug symbols using llvm-strip from NDK to optimize file size
          STRIP_TOOL="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          if [ ! -f "$STRIP_TOOL" ]; then
            STRIP_TOOL=$(command -v llvm-strip || command -v strip || true)
          fi

          if [ -n "$STRIP_TOOL" ]; then
            echo "[+] Stripping libdaneshmate_core.so symbols using $STRIP_TOOL..."
            find frontend/android/app/src/main/jniLibs -name "libdaneshmate_core.so" -exec "$STRIP_TOOL" --strip-all {} + || true
          fi

          echo "=== Embedded 64-bit Android jniLibs ==="
          ls -lh frontend/android/app/src/main/jniLibs/arm64-v8a/libdaneshmate_core.so

      - name: 12. Run Automated TypeScript FFI Smoke Tests
        run: |
          npm run test:ffi

      - name: 13. Generate Temporary Test Keystore & Assemble Standalone Release APK
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          
          # Generate a self-signed temporary keystore exclusively for this test run
          TEST_KEYSTORE_PATH="${RUNNER_TEMP}/daneshmate-test.keystore"
          TEST_PASSWORD="daneshmate_test_pass"
          TEST_ALIAS="daneshmate_test"
          
          echo "[+] Generating runner-local test keystore with keytool..."
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore "$TEST_KEYSTORE_PATH" \
            -alias "$TEST_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 365 \
            -storepass "$TEST_PASSWORD" \
            -keypass "$TEST_PASSWORD" \
            -dname "CN=DaneshMateTest, OU=Mobile, O=DaneshMate, L=Tehran, ST=Tehran, C=IR"

          echo "[✓] Temporary test keystore created at: $TEST_KEYSTORE_PATH"

          cd frontend/android
          chmod +x gradlew

          # Assemble Release APK (Triggers Hermes compilation + JS offline embedding: createBundleReleaseJsAndAssets)
          export RELEASE_KEYSTORE_PATH="$TEST_KEYSTORE_PATH"
          export RELEASE_KEYSTORE_PASSWORD="$TEST_PASSWORD"
          export RELEASE_KEY_ALIAS="$TEST_ALIAS"
          export RELEASE_KEY_PASSWORD="$TEST_PASSWORD"

          echo "[+] Running Gradle assembleRelease for Standalone Test APK..."
          ./gradlew assembleRelease --stacktrace

          echo "=== Generated Android APKs ==="
          find app/build/outputs/apk -type f -name "*.apk"
          echo "=============================="

          FOUND_ARM64=$(find app/build/outputs/apk -type f -name "*arm64-v8a*release*.apk" | head -n 1)
          if [ -z "$FOUND_ARM64" ]; then
            FOUND_ARM64=$(find app/build/outputs/apk -type f -name "*arm64-v8a*.apk" | head -n 1)
          fi
          if [ -z "$FOUND_ARM64" ]; then
            FOUND_ARM64=$(find app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          fi
          if [ -z "$FOUND_ARM64" ]; then
            FOUND_ARM64=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi

          if [ -n "$FOUND_ARM64" ] && [ -f "$FOUND_ARM64" ]; then
            echo "[✓] Located Release APK: $FOUND_ARM64 -> DaneshMate-Android-Test.apk"
            cp -f "$FOUND_ARM64" "${GITHUB_WORKSPACE}/artifacts/DaneshMate-Android-Test.apk"
          else
            echo "[-] Error: Release APK was not found!"
            exit 1
          fi

          echo "[+] Inspecting and verifying required internal assets inside APK..."
          APK_ENTRIES=$(unzip -l "$FOUND_ARM64")

          # 1. VERIFY OFFLINE JAVASCRIPT BUNDLE (Prevents 'Unable to load script' error)
          echo "$APK_ENTRIES" | grep -q "assets/index.android.bundle" || {
            echo "[-] CRITICAL ERROR: Missing assets/index.android.bundle inside APK!"
            echo "[-] The app will fail to load without Metro!"
            exit 1
          }
          echo "[✓] PASS: assets/index.android.bundle is present inside APK (100% Standalone Offline Bundle)"

          # 2. VERIFY EMBEDDED RUST NATIVE C-ABI LIBRARY
          echo "$APK_ENTRIES" | grep -q "lib/arm64-v8a/libdaneshmate_core.so" || {
            echo "[-] CRITICAL ERROR: Missing lib/arm64-v8a/libdaneshmate_core.so inside APK!"
            exit 1
          }
          echo "[✓] PASS: lib/arm64-v8a/libdaneshmate_core.so is present (Embedded 64-bit Rust Core)"

          # 3. VERIFY HERMES RUNTIME ENGINE
          echo "$APK_ENTRIES" | grep -q "lib/arm64-v8a/libhermes.so" || {
            echo "[-] CRITICAL ERROR: Missing lib/arm64-v8a/libhermes.so inside APK!"
            exit 1
          }
          echo "[✓] PASS: lib/arm64-v8a/libhermes.so is present (Hermes Engine)"

          echo "=== Verification Summary ==="
          echo "APK Size: $(ls -lh "${GITHUB_WORKSPACE}/artifacts/DaneshMate-Android-Test.apk" | awk '{print $5}')"
          echo "Signature verification:"
          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -n "$APKSIGNER_BIN" ]; then
            "$APKSIGNER_BIN" verify --print-certs "$FOUND_ARM64"
          fi
          echo "============================"

      - name: 14. Cleanup Temporary Keystore
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/daneshmate-test.keystore" || true
          echo "[✓] Temporary test keystore purged from runner."

      - name: 15. Upload Gradle Build Failure Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-build-reports
          path: frontend/android/app/build/reports/
          if-no-files-found: ignore

      - name: 16. Upload Standalone Test APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaneshMate-Android-Test
          path: artifacts/DaneshMate-Android-Test.apk
          if-no-files-found: error
