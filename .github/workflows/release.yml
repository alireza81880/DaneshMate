name: Production Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # JOB 1: Android Native Rust Core & Standalone APK Build (Ubuntu)
  # ============================================================================
  build-android:
    name: Build Android (Standalone APK, AAB & Native jniLibs)
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set Up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Set Up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 4. Set Up Android NDK & SDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: 5. Set Up Rust Stable Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android

      - name: 6. Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked || true

      - name: 7. Install Dependencies
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          cd frontend && (npm install --no-audit --no-fund --legacy-peer-deps)

      - name: 8. Generate Platform Assets from Source
        run: |
          npm install --no-save --legacy-peer-deps sharp || (cd frontend && npm install --no-save --legacy-peer-deps sharp)
          node frontend/scripts/generate_assets.js

      - name: 9. Scaffold Native Android Project via Expo Prebuild
        run: |
          cd frontend
          npx expo prebuild --clean --platform android --no-install

      - name: 10. Execute Rust Android Cross-Compilation & Populate jniLibs
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x backend/scripts/build_rust_mobile.sh
          ./backend/scripts/build_rust_mobile.sh

      - name: 11. Run Automated TypeScript FFI Smoke Tests
        run: |
          npm run test:ffi

      - name: 12. Assemble Standalone Android APK & AAB
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          cd frontend/android
          chmod +x gradlew

          # Attempt release build; fall back to assembleDebug if keystore signing is unconfigured
          ./gradlew assembleRelease || ./gradlew assembleDebug || true
          ./gradlew bundleRelease || true

          # Find and export standalone APK
          FOUND_APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
            echo "[✓] Located compiled Android APK: $FOUND_APK"
            cp -f "$FOUND_APK" "${GITHUB_WORKSPACE}/artifacts/DaneshMate-Android.apk"
          else
            echo "[!] No APK located in app/build/outputs/apk"
          fi

          # Find and export production AAB bundle
          FOUND_AAB=$(find app/build/outputs/bundle -type f -name "*.aab" | head -n 1)
          if [ -n "$FOUND_AAB" ] && [ -f "$FOUND_AAB" ]; then
            echo "[✓] Located compiled Android AAB: $FOUND_AAB"
            cp -f "$FOUND_AAB" "${GITHUB_WORKSPACE}/artifacts/DaneshMate-Android.aab"
          fi

          # Package compiled jniLibs
          if [ -d "app/src/main/jniLibs" ]; then
            (cd app/src/main && zip -r "${GITHUB_WORKSPACE}/artifacts/daneshmate_core_jniLibs.zip" jniLibs)
          fi

      - name: 13. Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: artifacts/*
          if-no-files-found: warn

  # ============================================================================
  # JOB 2: iOS Native Rust Core & Standalone Artifact Build (macOS-14)
  # ============================================================================
  build-ios:
    name: Build iOS (Standalone Simulator .app.zip, .ipa & XCFramework)
    runs-on: macos-14
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set Up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Set Up Rust Stable Toolchain & iOS Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-apple-ios
            aarch64-apple-ios-sim
            x86_64-apple-ios

      - name: 4. Install Dependencies
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          cd frontend && (npm install --no-audit --no-fund --legacy-peer-deps)

      - name: 5. Generate Platform Assets from Source
        run: |
          npm install --no-save --legacy-peer-deps sharp || (cd frontend && npm install --no-save --legacy-peer-deps sharp)
          node frontend/scripts/generate_assets.js

      - name: 6. Scaffold Native iOS Project via Expo Prebuild
        run: |
          cd frontend
          npx expo prebuild --clean --platform ios --no-install

      - name: 7. Execute Rust iOS Cross-Compilation & Package DaneshMateCore.xcframework
        run: |
          chmod +x backend/scripts/build_rust_mobile.sh
          ./backend/scripts/build_rust_mobile.sh

      - name: 8. Run Automated TypeScript FFI Smoke Tests
        run: |
          npm run test:ffi

      - name: 9. Install CocoaPods Dependencies
        run: |
          cd frontend/ios
          pod install --repo-update || pod install || true

      - name: 10. Build Standalone iOS Application & Package Artifacts
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          cd frontend

          WORKSPACE_PATH=$(find ios -name "*.xcworkspace" | head -n 1)
          PROJECT_PATH=$(find ios -name "*.xcodeproj" | head -n 1)
          SCHEME_NAME="DaneshMate"

          if [ -n "$WORKSPACE_PATH" ]; then
            echo "[+] Compiling Xcode Workspace: $WORKSPACE_PATH (Scheme: $SCHEME_NAME)"
            xcodebuild -workspace "$WORKSPACE_PATH" \
              -scheme "$SCHEME_NAME" \
              -configuration Release \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO || true
          elif [ -n "$PROJECT_PATH" ]; then
            echo "[+] Compiling Xcode Project: $PROJECT_PATH (Scheme: $SCHEME_NAME)"
            xcodebuild -project "$PROJECT_PATH" \
              -scheme "$SCHEME_NAME" \
              -configuration Release \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO || true
          fi

          # Find compiled .app bundle
          APP_BUNDLE=$(find build -type d -name "*.app" | head -n 1)
          if [ -n "$APP_BUNDLE" ] && [ -d "$APP_BUNDLE" ]; then
            echo "[✓] Located compiled iOS .app bundle: $APP_BUNDLE"
            APP_PARENT_DIR=$(dirname "$APP_BUNDLE")
            APP_NAME=$(basename "$APP_BUNDLE")

            # 1. Zip iOS Simulator .app bundle
            (cd "$APP_PARENT_DIR" && zip -r "${GITHUB_WORKSPACE}/artifacts/DaneshMate-iOS-Simulator.zip" "$APP_NAME")

            # 2. Package unsigned .ipa payload
            mkdir -p /tmp/Payload
            cp -R "$APP_BUNDLE" /tmp/Payload/
            (cd /tmp && zip -r "${GITHUB_WORKSPACE}/artifacts/DaneshMate-iOS.ipa" Payload)
            rm -rf /tmp/Payload
          else
            echo "[!] No .app bundle found; packaging iOS native source bundle"
            (cd ios && zip -r "${GITHUB_WORKSPACE}/artifacts/DaneshMate-iOS-Source.zip" ./) || true
          fi

          # Package DaneshMateCore.xcframework
          if [ -d "ios/Frameworks/DaneshMateCore.xcframework" ]; then
            (cd ios/Frameworks && zip -r "${GITHUB_WORKSPACE}/artifacts/DaneshMateCore.xcframework.zip" DaneshMateCore.xcframework)
          fi

      - name: 11. Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: artifacts/*
          if-no-files-found: warn

  # ============================================================================
  # JOB 3: Publish GitHub Release (Consolidate Installable Binaries)
  # ============================================================================
  release-publish:
    name: Consolidate & Publish GitHub Release
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: release-artifacts

      - name: 3. Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-artifacts
          path: release-artifacts

      - name: 4. List Release Artifacts
        run: |
          echo "=== Release Artifacts Ready for Publication ==="
          ls -la release-artifacts/
          echo "==============================================="

      - name: 5. Determine or Generate Release Tag
        id: determine-tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(node -p "require('./frontend/package.json').version || '1.0.0'" 2>/dev/null || node -p "require('./package.json').version || '1.0.0'")
            TAG="v${VERSION}-build.${{ github.run_number }}"
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "Determined release tag: ${TAG}"

      - name: 6. Create GitHub Release & Upload Production Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "DaneshMate Release ${{ env.RELEASE_TAG }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*
