name: Production Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # JOB 1: Android Native Rust Core & Standalone ABI-Split APKs (Ubuntu)
  # ============================================================================
  build-android:
    name: Build Android (ABI-Split APKs & Native Rust Core)
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set Up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Set Up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 4. Set Up Android NDK & SDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: 5. Set Up Rust Stable Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi

      - name: 6. Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked || true

      - name: 7. Install Dependencies
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          cd frontend && (npm install --no-audit --no-fund --legacy-peer-deps)

      - name: 8. Generate Platform Assets from Source
        run: |
          npm install --no-save --legacy-peer-deps sharp || (cd frontend && npm install --no-save --legacy-peer-deps sharp)
          node frontend/scripts/generate_assets.js

      - name: 9. Scaffold Native Android Project via Expo Prebuild
        run: |
          cd frontend
          npx expo prebuild --clean --platform android --no-install

      - name: 10. Enable Android ABI Architecture Splits (arm64-v8a & armeabi-v7a)
        run: |
          cd frontend/android
          # Configure Gradle build per CPU architecture
          if [ -f "app/build.gradle" ]; then
            sed -i 's/def enableSeparateBuildPerCPUArchitecture = false/def enableSeparateBuildPerCPUArchitecture = true/g' app/build.gradle || true
            sed -i 's/enableSeparateBuildPerCPUArchitecture = false/enableSeparateBuildPerCPUArchitecture = true/g' app/build.gradle || true
            echo "[✓] Configured enableSeparateBuildPerCPUArchitecture = true in app/build.gradle"
          fi

      - name: 11. Cross-Compile Rust Native Libraries (libdaneshmate_core.so)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x backend/scripts/build_rust_mobile.sh
          ./backend/scripts/build_rust_mobile.sh
          echo "=== Embedded Android jniLibs ==="
          ls -la frontend/android/app/src/main/jniLibs/arm64-v8a/libdaneshmate_core.so || true
          ls -la frontend/android/app/src/main/jniLibs/armeabi-v7a/libdaneshmate_core.so || true

      - name: 12. Run Automated TypeScript FFI Smoke Tests
        run: |
          npm run test:ffi

      - name: 13. Assemble Standalone ABI-Split Android APKs
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          cd frontend/android
          chmod +x gradlew

          # Assemble release or debug APKs
          ./gradlew assembleRelease || ./gradlew assembleDebug || true

          echo "=== Generated Android APKs ==="
          find app/build/outputs/apk -type f -name "*.apk"
          echo "=============================="

          # 1. Target APK 1: arm64-v8a (Modern 64-bit Android)
          FOUND_ARM64=$(find app/build/outputs/apk -type f -name "*arm64-v8a*.apk" | head -n 1)
          if [ -n "$FOUND_ARM64" ] && [ -f "$FOUND_ARM64" ]; then
            echo "[✓] Located arm64-v8a APK: $FOUND_ARM64"
            cp -f "$FOUND_ARM64" "${GITHUB_WORKSPACE}/artifacts/DaneshMate-Android-arm64-v8a.apk"
          else
            FALLBACK_APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
            [ -n "$FALLBACK_APK" ] && cp -f "$FALLBACK_APK" "${GITHUB_WORKSPACE}/artifacts/DaneshMate-Android-arm64-v8a.apk"
          fi

          # 2. Target APK 2: armeabi-v7a (Legacy 32-bit Android)
          FOUND_ARMV7=$(find app/build/outputs/apk -type f -name "*armeabi-v7a*.apk" | head -n 1)
          if [ -n "$FOUND_ARMV7" ] && [ -f "$FOUND_ARMV7" ]; then
            echo "[✓] Located armeabi-v7a APK: $FOUND_ARMV7"
            cp -f "$FOUND_ARMV7" "${GITHUB_WORKSPACE}/artifacts/DaneshMate-Android-armeabi-v7a.apk"
          else
            FALLBACK_APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
            [ -n "$FALLBACK_APK" ] && cp -f "$FALLBACK_APK" "${GITHUB_WORKSPACE}/artifacts/DaneshMate-Android-armeabi-v7a.apk"
          fi

          echo "=== Android Artifacts Ready ==="
          ls -la "${GITHUB_WORKSPACE}/artifacts"

      - name: 14. Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: artifacts/*
          if-no-files-found: error

  # ============================================================================
  # JOB 2: iOS Target (Optimized PWA / Web Release with Service Worker)
  # ============================================================================
  build-ios:
    name: Build iOS Distribution (Optimized PWA Web Release)
    runs-on: macos-14
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set Up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Set Up Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-apple-ios
            aarch64-apple-ios-sim
            x86_64-apple-ios

      - name: 4. Install Dependencies
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          cd frontend && (npm install --no-audit --no-fund --legacy-peer-deps)

      - name: 5. Generate Platform Assets from Source
        run: |
          npm install --no-save --legacy-peer-deps sharp || (cd frontend && npm install --no-save --legacy-peer-deps sharp)
          node frontend/scripts/generate_assets.js

      - name: 6. Run Automated TypeScript FFI Smoke Tests
        run: |
          npm run test:ffi

      - name: 7. Export Production Web & PWA Bundle with Service Worker
        run: |
          cd frontend
          npx expo export -p web || npx expo export --platform web || true

          # If export generated dist or fallback to root web build
          if [ ! -d "dist" ]; then
            cd ..
            npm run build
            mkdir -p frontend/dist
            cp -r dist/* frontend/dist/
            cd frontend
          fi

          echo "[+] Configuring PWA Service Worker and Apple Mobile Web Metas in dist..."
          # Create service worker if not present
          if [ ! -f "dist/sw.js" ]; then
            cat << 'EOF' > dist/sw.js
// DaneshMate Offline PWA Service Worker
const CACHE_NAME = 'daneshmate-pwa-v1';
self.addEventListener('install', (e) => {
  self.skipWaiting();
});
self.addEventListener('activate', (e) => {
  e.waitUntil(clients.claim());
});
self.addEventListener('fetch', (e) => {
  e.respondWith(
    fetch(e.request).catch(() => caches.match(e.request))
  );
});
EOF
          fi

          # Register Service Worker & iOS Safari Web App meta tags in dist/index.html
          if [ -f "dist/index.html" ] && ! grep -q "serviceWorker" dist/index.html; then
            sed -i '' 's/<\/head>/<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("\.\/sw.js").catch(()=>{})})}<\/script><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="DaneshMate"><\/head>/' dist/index.html || true
          fi

          # Compress production web assets into DaneshMate-iOS-PWA-Web.zip
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          (cd dist && zip -r "${GITHUB_WORKSPACE}/artifacts/DaneshMate-iOS-PWA-Web.zip" ./)
          echo "[✓] Successfully generated DaneshMate-iOS-PWA-Web.zip"

      - name: 8. Upload iOS Web/PWA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: artifacts/*
          if-no-files-found: error

  # ============================================================================
  # JOB 3: Publish GitHub Release (With Exact Bilingual User Guide & Split Targets)
  # ============================================================================
  release-publish:
    name: Consolidate & Publish GitHub Release
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: release-artifacts

      - name: 3. Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-artifacts
          path: release-artifacts

      - name: 4. List Release Artifacts
        run: |
          echo "=== Release Artifacts Ready for Publication ==="
          ls -la release-artifacts/
          echo "==============================================="

      - name: 5. Determine or Generate Release Tag
        id: determine-tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.0-release"
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "Release tag set to: ${TAG}"

      - name: 6. Publish GitHub Release with Bilingual User Guide
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "DaneshMate Production Release ${{ env.RELEASE_TAG }}"
          draft: false
          prerelease: false
          body: |
            ## 🎓 DaneshMate Production Release

            ### 📱 راهنمای دانلود برای اندروید (Android):
            - **نسخه مدرن (arm64-v8a):** مناسب برای گوشیهای تولید شده در چند سال اخیر (اندروید ۸ به بالا) با کمترین حجم و بیشترین سرعت.
            - **نسخه کلاسیک (armeabi-v7a):** مناسب برای مدلهای قدیمیتر یا اقتصادی.

            ### 🍏 راهنمای نصب آیفون (iOS):
            - بدون نیاز به فایل .ipa یا فروشگاههای خارجی! بسته PWA را باز کرده، لینک وب را در مرورگر Safari باز کنید، آیکون Share را لمس کرده و گزینه **Add to Home Screen** را بزنید.

            ---
            *English Note: Download the corresponding APK based on your device architecture. iOS users can install the PWA instantly via Safari.*
          files: |
            release-artifacts/DaneshMate-Android-arm64-v8a.apk
            release-artifacts/DaneshMate-Android-armeabi-v7a.apk
            release-artifacts/DaneshMate-iOS-PWA-Web.zip
