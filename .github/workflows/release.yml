name: Production Release Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force re-running release even if Git tag already exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ============================================================================
  # JOB 1: Automatic Version & Git Tag Detection (Single Source of Truth)
  # ============================================================================
  version-check:
    name: Detect Application Version & Git Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect-version.outputs.version }}
      version_code: ${{ steps.detect-version.outputs.version_code }}
      tag: ${{ steps.detect-version.outputs.tag }}
      should_release: ${{ steps.detect-version.outputs.should_release }}
      is_pr: ${{ steps.detect-version.outputs.is_pr }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Version from package.json
        id: detect-version
        run: |
          # 1. Read Canonical Single Source of Truth from root package.json
          APP_VERSION=$(node -p "require('./package.json').version") || {
            echo "[-] ERROR: Failed to extract canonical version from package.json"
            exit 1
          }

          # 2. Validate strictly as MAJOR.MINOR.PATCH
          if ! [[ "$APP_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "[-] ERROR: Version '$APP_VERSION' is invalid. Must strictly match MAJOR.MINOR.PATCH format."
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"

          # 3. Calculate deterministic Android versionCode: major * 1000000 + minor * 1000 + patch
          APP_VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
          TAG="v${APP_VERSION}"

          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${APP_VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          echo "========================================================"
          echo "[✓] Canonical App Version Detected: ${APP_VERSION}"
          echo "[✓] Calculated Android VersionCode:  ${APP_VERSION_CODE}"
          echo "[✓] Target Git Release Tag:         ${TAG}"
          echo "========================================================"

          # 4. Check Event Type
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "[i] Pull Request build detected. CI validation mode active (no release or tag creation)."
            exit 0
          fi

          echo "is_pr=false" >> "$GITHUB_OUTPUT"

          # 5. Tag Safety: Check if Tag already exists on remote origin
          git fetch --tags origin || true
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "[-] ERROR: Tag ${TAG} already exists in repository!"
            echo "[-] Tag Safety Policy: Existing release tags (including historical v1.0.1) must NEVER be modified, moved, or overwritten."
            echo "[-] Please bump package.json to a new MAJOR.MINOR.PATCH version before releasing."
            exit 1
          else
            echo "[✓] New version ${APP_VERSION} detected! Tag ${TAG} does not exist yet."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================================
  # JOB 2: Modern Capacitor Android Release (arm64-v8a + Production Keystore)
  # ============================================================================
  build-android:
    name: Build Android (${{ needs.version-check.outputs.tag || 'CI' }})
    needs: version-check
    if: always() && !cancelled() && (needs.version-check.outputs.should_release == 'true' || needs.version-check.outputs.is_pr == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set Up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Set Up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Set Up Android NDK & SDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: 5. Set Up Rust Toolchain (arm64-v8a Android Target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android

      - name: 6. Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked

      - name: 7. Install Project Dependencies
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: 8. Build Web Production Application (Vite + Tailwind)
        run: |
          npm run build

      - name: 9. Sync Web Assets with Capacitor Android Shell
        run: |
          npx cap sync android

      - name: 10. Cross-Compile & Strip Rust Native Library (libdaneshmate_core.so)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x backend/scripts/build_rust_mobile.sh
          ./backend/scripts/build_rust_mobile.sh
          test -f android/app/src/main/jniLibs/arm64-v8a/libdaneshmate_core.so || exit 1

          # Remove non-64-bit architectures
          rm -rf android/app/src/main/jniLibs/armeabi-v7a
          rm -rf android/app/src/main/jniLibs/x86

          # Strip debug symbols using llvm-strip from NDK to optimize file size
          STRIP_TOOL="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          if [ ! -f "$STRIP_TOOL" ]; then
            STRIP_TOOL=$(command -v llvm-strip || command -v strip || true)
          fi

          if [ -n "$STRIP_TOOL" ]; then
            echo "[+] Stripping libdaneshmate_core.so symbols using $STRIP_TOOL..."
            find android/app/src/main/jniLibs -name "libdaneshmate_core.so" -exec "$STRIP_TOOL" --strip-all {} + || true
          fi

          echo "=== Embedded 64-bit Android jniLibs ==="
          ls -lh android/app/src/main/jniLibs/arm64-v8a/libdaneshmate_core.so

      - name: 11. Run Automated TypeScript FFI Smoke Tests
        run: |
          npm run test:ffi

      - name: 12. Verify & Decode Production Release Keystore (Strict Production Security)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          MYKET_PUBLIC_KEY: ${{ secrets.MYKET_PUBLIC_KEY }}
          IS_RELEASE_BUILD: ${{ needs.version-check.outputs.should_release }}
        run: |
          if [ "$IS_RELEASE_BUILD" = "true" ]; then
            # 1. Verify required production release secrets without exposing values
            MISSING_KEYSTORE_SECRETS=""
            if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then MISSING_KEYSTORE_SECRETS="${MISSING_KEYSTORE_SECRETS}\n  - RELEASE_KEYSTORE_BASE64"; fi
            if [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then MISSING_KEYSTORE_SECRETS="${MISSING_KEYSTORE_SECRETS}\n  - RELEASE_KEYSTORE_PASSWORD"; fi
            if [ -z "$RELEASE_KEY_ALIAS" ]; then MISSING_KEYSTORE_SECRETS="${MISSING_KEYSTORE_SECRETS}\n  - RELEASE_KEY_ALIAS"; fi
            if [ -z "$RELEASE_KEY_PASSWORD" ]; then MISSING_KEYSTORE_SECRETS="${MISSING_KEYSTORE_SECRETS}\n  - RELEASE_KEY_PASSWORD"; fi

            MISSING_MYKET_SECRET=""
            if [ -z "$MYKET_PUBLIC_KEY" ]; then MISSING_MYKET_SECRET="${MISSING_MYKET_SECRET}\n  - MYKET_PUBLIC_KEY"; fi

            if [ -n "$MISSING_KEYSTORE_SECRETS" ] || [ -n "$MISSING_MYKET_SECRET" ]; then
              echo "================================================================="
              echo "[-] ERROR: Required GitHub Actions Secret(s) are missing or empty:"
              if [ -n "$MISSING_KEYSTORE_SECRETS" ]; then
                echo "Keystore Signing Secrets:"
                echo -e "$MISSING_KEYSTORE_SECRETS"
              fi
              if [ -n "$MISSING_MYKET_SECRET" ]; then
                echo "Myket In-App Billing Secret:"
                echo -e "$MISSING_MYKET_SECRET"
              fi
              echo ""
              echo "Please configure these secrets in your GitHub repository settings:"
              echo "  GitHub Repo -> Settings -> Secrets and variables -> Actions -> New repository secret"
              echo "================================================================="
              exit 1
            fi

            # 2. Safely decode temporary keystore outside repository tree (stripping any accidental whitespace/newlines)
            if ! printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "${{ runner.temp }}/daneshmate-release.keystore"; then
              echo "[-] ERROR: Failed to decode RELEASE_KEYSTORE_BASE64. Ensure the secret contains valid Base64 string."
              exit 1
            fi

            if [ ! -s "${{ runner.temp }}/daneshmate-release.keystore" ]; then
              echo "[-] ERROR: Decoded keystore file is empty (0 bytes). Please verify RELEASE_KEYSTORE_BASE64."
              exit 1
            fi

            # 3. Verify keystore integrity with keytool (validates password, alias and certificate)
            if ! keytool -list -keystore "${{ runner.temp }}/daneshmate-release.keystore" -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" > /dev/null 2>&1; then
              echo "[-] ERROR: Keystore cannot be opened with the provided RELEASE_KEYSTORE_PASSWORD and RELEASE_KEY_ALIAS."
              echo "[-] Please verify that RELEASE_KEYSTORE_PASSWORD and RELEASE_KEY_ALIAS match the keystore."
              exit 1
            fi

            echo "[✓] Production release keystore successfully verified and decoded into ${{ runner.temp }}/daneshmate-release.keystore"
          else
            echo "[i] PR / CI Validation Build: Skipping production keystore decoding."
          fi

      - name: 13. Assemble Modern Android Release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/daneshmate-release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          MYKET_PUBLIC_KEY: ${{ secrets.MYKET_PUBLIC_KEY }}
          DISTRIBUTION_CHANNEL: myket
          APP_VERSION: ${{ needs.version-check.outputs.version }}
          APP_VERSION_CODE: ${{ needs.version-check.outputs.version_code }}
          IS_RELEASE_BUILD: ${{ needs.version-check.outputs.should_release }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          cd android
          chmod +x gradlew

          if [ "$IS_RELEASE_BUILD" = "true" ]; then
            # Assemble production release APK with injected versionCode, versionName, and Myket configuration
            ./gradlew assembleRelease \
              -PversionName="$APP_VERSION" \
              -PversionCode="$APP_VERSION_CODE" \
              -PDISTRIBUTION_CHANNEL="$DISTRIBUTION_CHANNEL" \
              -PMYKET_PUBLIC_KEY="$MYKET_PUBLIC_KEY" \
              --stacktrace

            echo "=== Generated Android APKs ==="
            find app/build/outputs/apk -type f -name "*.apk"
            echo "=============================="

            FOUND_RELEASE=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
            if [ -z "$FOUND_RELEASE" ]; then
              FOUND_RELEASE=$(find app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
            fi
            if [ -z "$FOUND_RELEASE" ]; then
              FOUND_RELEASE=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
            fi

            if [ -n "$FOUND_RELEASE" ] && [ -f "$FOUND_RELEASE" ]; then
              TARGET_NAME="DaneshMate-Android-v${APP_VERSION}.apk"
              echo "[✓] Located Release APK: $FOUND_RELEASE -> $TARGET_NAME"
              cp -f "$FOUND_RELEASE" "${GITHUB_WORKSPACE}/artifacts/${TARGET_NAME}"
            else
              echo "[-] Error: Release APK was not found!"
              exit 1
            fi

            # Strict APK Validation (Requirement 6)
            echo "=== Validating Production APK Metadata ==="
            AAPT_BIN=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
            if [ -n "$AAPT_BIN" ]; then
              BADGING=$("$AAPT_BIN" dump badging "${GITHUB_WORKSPACE}/artifacts/${TARGET_NAME}")
              echo "$BADGING" | head -n 15

              # 1. Validate applicationId
              echo "$BADGING" | grep -q "package: name='com.daneshmate.app'" || {
                echo "[-] ERROR: APK applicationId is not 'com.daneshmate.app'!"
                exit 1
              }
              echo "[✓] Validated applicationId = com.daneshmate.app"

              # 2. Validate versionCode
              echo "$BADGING" | grep -q "versionCode='${APP_VERSION_CODE}'" || {
                echo "[-] ERROR: APK versionCode does not match expected '${APP_VERSION_CODE}'!"
                exit 1
              }
              echo "[✓] Validated versionCode = ${APP_VERSION_CODE}"

              # 3. Validate versionName
              echo "$BADGING" | grep -q "versionName='${APP_VERSION}'" || {
                echo "[-] ERROR: APK versionName does not match expected '${APP_VERSION}'!"
                exit 1
              }
              echo "[✓] Validated versionName = ${APP_VERSION}"
            else
              echo "[!] Note: aapt binary not found in build-tools; skipping aapt badging checks."
            fi

            # 4. Verify embedded web assets in APK
            echo "[+] Verifying embedded web assets in APK..."
            APK_ENTRIES=$(unzip -l "${GITHUB_WORKSPACE}/artifacts/${TARGET_NAME}")
            echo "$APK_ENTRIES" | grep -q "assets/public/index.html" || {
              echo "[-] ERROR: Missing assets/public/index.html inside APK!"
              exit 1
            }
            echo "[✓] Verified assets/public/index.html is present"

            # 5. Verify production signature
            echo "=== APK Signature & Certificate Verification ==="
            APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
            if [ -n "$APKSIGNER_BIN" ]; then
              "$APKSIGNER_BIN" verify --print-certs "${GITHUB_WORKSPACE}/artifacts/${TARGET_NAME}" || {
                echo "[-] ERROR: APK signature verification failed!"
                exit 1
              }
            else
              apksigner verify --print-certs "${GITHUB_WORKSPACE}/artifacts/${TARGET_NAME}" || {
                echo "[-] ERROR: APK signature verification failed!"
                exit 1
              }
            fi
            echo "[✓] Verified APK is signed with production credentials."
            echo "==============================================="
          else
            echo "[i] PR Build: Assembling debug APK for verification..."
            ./gradlew assembleDebug -PversionName="$APP_VERSION" -PversionCode="$APP_VERSION_CODE" --stacktrace
            cp -f $(find app/build/outputs/apk -type f -name "*.apk" | head -n 1) "${GITHUB_WORKSPACE}/artifacts/DaneshMate-Android-PR-Test.apk" || true
          fi

          echo "=== Android Artifacts Ready ==="
          ls -lh "${GITHUB_WORKSPACE}/artifacts"

      - name: 14. Upload Gradle Build Failure Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: android/app/build/reports/
          if-no-files-found: ignore

      - name: 15. Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: artifacts/*
          if-no-files-found: error

      - name: 16. Cleanup Temporary Release Keystore
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/daneshmate-release.keystore" ]; then
            rm -f "${{ runner.temp }}/daneshmate-release.keystore"
            echo "[✓] Temporary keystore file purged securely from runner."
          fi

  # ============================================================================
  # JOB 3: Progressive Web App (PWA) Export
  # ============================================================================
  build-pwa:
    name: Build PWA / Web Export (${{ needs.version-check.outputs.tag || 'CI' }})
    needs: version-check
    if: always() && !cancelled() && (needs.version-check.outputs.should_release == 'true' || needs.version-check.outputs.is_pr == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set Up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install Dependencies
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: 4. Run Automated TypeScript FFI Smoke Tests
        run: |
          npm run test:ffi

      - name: 5. Build Production Web Application
        run: |
          npm run build

      - name: 6. Package Web & PWA Bundle with Service Worker
        env:
          APP_VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          echo "[+] Configuring PWA Service Worker in dist..."
          if [ ! -f "dist/sw.js" ]; then
            node -e "
              const sw = '// DaneshMate Offline PWA Service Worker\n' +
                'const CACHE_NAME = \"daneshmate-pwa-v1\";\n' +
                'self.addEventListener(\"install\", (e) => { self.skipWaiting(); });\n' +
                'self.addEventListener(\"activate\", (e) => { e.waitUntil(clients.claim()); });\n' +
                'self.addEventListener(\"fetch\", (e) => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });\n';
              require('fs').writeFileSync('dist/sw.js', sw);
            "
          fi

          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          PWA_ZIP_NAME="DaneshMate-v${APP_VERSION:-1.0.0}-PWA.zip"
          (cd dist && zip -r "${GITHUB_WORKSPACE}/artifacts/${PWA_ZIP_NAME}" ./)
          echo "[✓] Successfully generated ${PWA_ZIP_NAME}"

      - name: 7. Upload Web/PWA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwa-artifacts
          path: artifacts/*
          if-no-files-found: error

  # ============================================================================
  # JOB 4: Create Git Tag & Publish Production GitHub Release (Automated)
  # ============================================================================
  release-publish:
    name: Publish Production GitHub Release (${{ needs.version-check.outputs.tag }})
    needs: [version-check, build-android, build-pwa]
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: release-artifacts

      - name: 3. Download PWA Artifacts
        uses: actions/download-artifact@v4
        with:
          name: pwa-artifacts
          path: release-artifacts

      - name: 4. Generate SHA-256 Checksums
        id: checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          echo "=== Artifact SHA-256 Checksums ==="
          cat SHA256SUMS.txt
          echo "=================================="
          echo "checksums<<EOF" >> "$GITHUB_OUTPUT"
          cat SHA256SUMS.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 5. Create & Push Git Release Tag
        env:
          TAG: ${{ needs.version-check.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "[-] ERROR: Tag ${TAG} already exists on remote! Tag safety policy prevents modifying or overwriting existing tags."
            exit 1
          fi

          echo "[+] Creating Git Tag: ${TAG} on commit ${{ github.sha }}..."
          git tag -a "${TAG}" -m "DaneshMate Production Release ${TAG}"
          git push origin "${TAG}"
          echo "[✓] Successfully pushed tag ${TAG} to repository."

      - name: 6. Publish GitHub Release with Bilingual User Guide
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version-check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "DaneshMate v${{ needs.version-check.outputs.version }}"
          draft: false
          prerelease: false
          body: |
            # 🎓 DaneshMate v${{ needs.version-check.outputs.version }}

            <div dir="rtl" align="right">

            ### 📋 مشخصات انتشار
            * **نسخه:** `${{ needs.version-check.outputs.version }}`
            * **نسخه اندروید:** `${{ needs.version-check.outputs.version_code }}`
            * **معماری:** `arm64-v8a`
            * **نوع انتشار:** Production
            * **داده‌ها:** Local-first / Offline

            ### 📱 نسخه ویژه اندروید (Capacitor + Rust Core)
            * **معماری بهینه‌شده:** فقط پردازنده‌های ۶۴ بیتی (`arm64-v8a`) با هسته Rust C-ABI و وب‌ویوی بومی Capacitor.
            * **بهینه‌سازی حجم و سرعت:** طراحی واکنش‌گرا و مدرن بر پایه React 19، Vite و Tailwind v4.
            * **امنیت و امضا:** کامپایل‌شده با امضای رسمی Production Keystore بدون وابستگی‌های خارجی.
            * **کاملاً آفلاین:** عملکرد کامل و مستقل بدون نیاز به اینترنت.

            ### 🌐 نسخه وب و تحت مرورگر (PWA)
            * آرشیو وب / PWA به عنوان نسخه تحت مرورگر بدون نیاز به نصب در دسترس است.

            ### 🔐 شناسه یکپارچگی فایل‌ها (SHA-256 Checksums)
            ```text
            ${{ steps.checksums.outputs.checksums }}
            ```

            </div>

            ---

            ### 🌍 English Summary
            * **Version:** `${{ needs.version-check.outputs.version }}`
            * **Android VersionCode:** `${{ needs.version-check.outputs.version_code }}`
            * **Architecture:** `arm64-v8a` (Android 64-bit)
            * **Release Type:** Production
            * **Data Model:** Local-first / Offline
            * **Artifacts:** High-performance signed Android APK and PWA bundle.
          files: |
            release-artifacts/*
